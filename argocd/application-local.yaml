apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qdrant-local
  namespace: argocd
  # Lets ArgoCD clean up the Helm-rendered resources on delete.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Point at your Git repo once this is committed.
    repoURL: https://github.com/Joxtacy/qdrant-gitops.git
    targetRevision: main
    path: overlays/local
  destination:
    server: https://kubernetes.default.svc
    namespace: qdrant
  # The local overlay omits storageClassName so OrbStack's default provisioner
  # fills it in. The chart then renders `storageClassName: null`, which ArgoCD's
  # differ treats as distinct from the field being absent on the live resource —
  # leaving the StatefulSet permanently OutOfSync. Ignore just that field.
  # (Prod sets storageClassName explicitly, so it doesn't hit this.)
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: qdrant
      jqPathExpressions:
        - .spec.volumeClaimTemplates[].spec.storageClassName
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
