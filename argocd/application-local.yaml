apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qdrant-local
  namespace: argocd
  annotations:
    # Diff via an API-server dry-run so server-defaulted fields (revisionHistory-
    # Limit, dnsPolicy, volumeMode, storageClassName, etc.) are applied to the
    # desired manifest too and cancel against live. Without this the Helm-rendered
    # StatefulSet sits permanently OutOfSync against its own defaulted live state.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  # Lets ArgoCD clean up the Helm-rendered resources on delete.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Point at your Git repo once this is committed.
    repoURL: https://github.com/Joxtacy/qdrant-gitops.git
    targetRevision: main
    path: overlays/local
  destination:
    server: https://kubernetes.default.svc
    namespace: qdrant
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
